name: kontrol

# Resolv (USR) symbolic audit — Kontrol proof matrix.
#
# One job per test suite. Each job installs the LayerZero JS deps (needed to
# compile the OFT adapter), then builds with the pinned Kontrol image
# (ubuntu-jammy-1.0.255 — the same one used across the campaign) and runs
# `kontrol prove` with an explicit verdict line so a timeout never erases
# results.
#
# This repo lives under `artsbykriss` so it never touches the main campaign's
# runners or quota.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  KONTROL_IMAGE: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.255

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite:
          - StUSR_Test
          - WstUSR_Test
          - UsrRedemption_Test
          - W4_Requests_Test
          - W3_Staking_Test
          - PriceStorage_Test
          - W5_Coordinator_Test
          - W6_OFT_Test
    steps:
      - uses: actions/checkout@v4

      - name: Install LayerZero JS dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          ls node_modules/@layerzerolabs

      # The Kontrol container runs as root and writes `out/`; the bind-mounted
      # workspace must be world-writable, otherwise `kontrol build` fails with
      # `"/work/out": Permission denied`. This must happen BEFORE the build.
      - name: Make workspace writable
        run: |
          chmod -R a+rwX .
          mkdir -p out && chmod -R a+rwX out

      - name: kontrol build (docker)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/work -w /work \
            "$KONTROL_IMAGE" \
            kontrol build 2>&1 | tee build_output.log | tail -5
          sudo chown -R "$(id -u):$(id -g)" .

      - name: kontrol prove (suite)
        run: |
          set +e
          V="verdicts_${{ matrix.suite }}.txt"; : > "$V"
          PROVE_OPTS="--use-booster --no-break-on-calls --no-stack-checks --no-log-rewrites \
            --max-frontier-parallel 2 --max-depth 50000 --max-iterations 100000 \
            --smt-timeout 30000 --smt-retry-limit 2 --workers 2 --step-timeout 600 \
            --auto-abstract-gas"
          echo "=== ${{ matrix.suite }} ===" | tee -a "$V"
          timeout -k 30s 2400s docker run --rm -v "$PWD":/work -w /work \
            "$KONTROL_IMAGE" \
            kontrol prove --match-contract "${{ matrix.suite }}" $PROVE_OPTS \
            > "prove_${{ matrix.suite }}.log" 2>&1
          rc=$?
          if grep -qE 'PROOF (PASSED|FAILED)' "prove_${{ matrix.suite }}.log"; then
            grep -E 'PROOF (PASSED|FAILED)' "prove_${{ matrix.suite }}.log" >> "$V"
          elif [ "$rc" -eq 124 ]; then
            echo "=== ${{ matrix.suite }} INCOMPLETE (wall-timeout; kcfg checkpointed) ===" >> "$V"
          elif grep -qE 'CHEATCODE_UNIMPLEMENTED|[Uu]nimplemented|Exception|Fatal' "prove_${{ matrix.suite }}.log"; then
            echo "=== ${{ matrix.suite }} INCOMPLETE (abort; kcfg checkpointed) ===" >> "$V"
          else
            echo "=== ${{ matrix.suite }} INCOMPLETE (rc=$rc; kcfg checkpointed) ===" >> "$V"
          fi
          sudo chown -R "$(id -u):$(id -g)" . || true
          if [ -d out/proofs ]; then
            tar -czf "kcfg_${{ matrix.suite }}.tgz" -C out proofs || true
          fi

      - name: Extract verdicts
        if: always()
        run: cat "verdicts_${{ matrix.suite }}.txt" || true

      - name: Upload verdicts + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolv-${{ matrix.suite }}-results
          path: |
            verdicts_${{ matrix.suite }}.txt
            prove_${{ matrix.suite }}.log
            build_output.log
          if-no-files-found: ignore

      - name: Upload KCFG checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolv-${{ matrix.suite }}-kcfg
          path: kcfg_${{ matrix.suite }}.tgz
          if-no-files-found: ignore
          retention-days: 14
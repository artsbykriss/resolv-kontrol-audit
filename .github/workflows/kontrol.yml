name: kontrol

# Resolv (USR) symbolic audit — Kontrol proof matrix.
#
# One job per test suite. Each job installs the LayerZero JS deps (needed to
# compile the OFT adapter), then builds with the pinned Kontrol image
# (ubuntu-jammy-1.0.255 — the same one used across the campaign) and runs
# `kontrol prove` with an explicit verdict line so a timeout never erases
# results.
#
# This repo lives under `artsbykriss` so it never touches the main campaign's
# runners or quota.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  KONTROL_IMAGE: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.255

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite:
          - StUSR_Test
          - WstUSR_Test
          - UsrRedemption_Test
          - W4_Requests_Test
          - W3_Staking_Test
          - PriceStorage_Test
          - W5_Coordinator_Test
          - W6_OFT_Test
    steps:
      - uses: actions/checkout@v4

      - name: Install LayerZero JS dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          ls node_modules/@layerzerolabs

      # The Kontrol container runs as root and writes `out/`; the bind-mounted
      # workspace must be world-writable, otherwise `kontrol build` fails with
      # `"/work/out": Permission denied`. This must happen BEFORE the build.
      - name: Make workspace writable
        run: |
          chmod -R a+rwX .
          mkdir -p out && chmod -R a+rwX out

      - name: kontrol build (docker)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/work -w /work \
            "$KONTROL_IMAGE" \
            kontrol build 2>&1 | tee build_output.log | tail -5
          sudo chown -R "$(id -u):$(id -g)" .

      # NOTE: `kontrol prove` (1.0.255) has NO `--match-contract`; it only
      # accepts `--match-test` (a regex matched against the bare function
      # name). We therefore drive one invocation per test from the checked-in
      # `tests/<Suite>.tests` list — the same proven pattern as the main
      # campaign — which also bounds each proof and checkpoints its KCFG.
      - name: kontrol prove (one invocation per test)
        run: |
          set +e
          SUITE="${{ matrix.suite }}"
          TESTS_FILE="tests/${SUITE}.tests"
          V="verdicts_${SUITE}.txt"; : > "$V"
          chmod -R a+rwX . 2>/dev/null || true
          PROVE_OPTS="--use-booster --no-break-on-calls --no-stack-checks --no-log-rewrites \
            --max-frontier-parallel 2 --max-depth 50000 --max-iterations 100000 \
            --smt-timeout 30000 --smt-retry-limit 2 --workers 2 --step-timeout 600 \
            --auto-abstract-gas"
          echo "=== ${SUITE} ===" | tee -a "$V"
          NTESTS=$(grep -c . "$TESTS_FILE")
          # Whole-suite budget 300m (< 350m job cap); cap each proof at 35m so a
          # single hard test cannot consume the entire suite.
          BUDGET=$(( 300 * 60 / NTESTS )); [ "$BUDGET" -gt 2100 ] && BUDGET=2100
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            # The Kontrol container runs `kontrol prove` as a NON-root user while
            # `out/` was created by root (build) and re-chowned to the runner
            # between tests. Without re-opening perms the next run cannot mkdir
            # under `out/proofs` → `PermissionError: 'out/proofs/<id>:0'`.
            chmod -R a+rwX . 2>/dev/null || true
            echo "=== ${SUITE}: $t ===" | tee -a "$V" "prove_${SUITE}.log"
            timeout -k 30s "${BUDGET}s" docker run --rm -v "$PWD":/work -w /work \
              "$KONTROL_IMAGE" \
              kontrol prove --match-test "${t}" $PROVE_OPTS > /tmp/prove_one.log 2>&1
            rc=$?
            cat /tmp/prove_one.log >> "prove_${SUITE}.log"
            if grep -qE 'PROOF (PASSED|FAILED)' /tmp/prove_one.log; then
              grep -E 'PROOF (PASSED|FAILED)' /tmp/prove_one.log >> "$V"
            elif [ "$rc" -eq 124 ]; then
              echo "=== ${t} INCOMPLETE (wall-timeout; kcfg checkpointed) ===" >> "$V"
            elif grep -qE 'CHEATCODE_UNIMPLEMENTED|[Uu]nimplemented|Exception|Fatal' /tmp/prove_one.log; then
              echo "=== ${t} INCOMPLETE (abort; kcfg checkpointed) ===" >> "$V"
            else
              echo "=== ${t} INCOMPLETE (rc=$rc; kcfg checkpointed) ===" >> "$V"
            fi
            sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
          done < "$TESTS_FILE"
          if [ -d out/proofs ]; then
            tar -czf "kcfg_${SUITE}.tgz" -C out proofs || true
          fi

      - name: Extract verdicts
        if: always()
        run: cat "verdicts_${{ matrix.suite }}.txt" || true

      - name: Upload verdicts + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolv-${{ matrix.suite }}-results
          path: |
            verdicts_${{ matrix.suite }}.txt
            prove_${{ matrix.suite }}.log
            build_output.log
          if-no-files-found: ignore

      - name: Upload KCFG checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolv-${{ matrix.suite }}-kcfg
          path: kcfg_${{ matrix.suite }}.tgz
          if-no-files-found: ignore
          retention-days: 14